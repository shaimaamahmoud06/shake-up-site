<body>
  <!-- topBar: slim, never moves. Logo = live wordmark until the white logo SVG
       (assets/svg/shake-up-logo.svg) is delivered. World links are filled by topBar.js. -->
  <header class="su-top-bar" id="top-bar">
    <a class="su-top-bar__logo" id="brand-name" href="#" data-asset-placeholder="shake-up-logo.svg">شيك أب</a>
    <nav class="su-top-bar__worlds" id="worldtabs" aria-label="الأقسام"></nav>
  </header>

  <!-- The small logo at the hero's top left. While the hero is the page you are on, it stands in for
       the top bar; once you reach page 2 the top bar comes back in its place (hero.js). Without JS
       it stays hidden and the top bar shows as always. Decorative (alt=""): the brand name is in the
       page title and the top bar. dir="ltr" keeps it at the LEFT in both languages. -->
  <img class="su-hero-logo" id="hero-logo" src="assets/img/logo-small.png" alt="" dir="ltr" width="360" height="312">

  <!-- hero (sketch Page 1): media is set in src/js/components/hero.js. The placeholder below shows
       until the journey clip + interior photo are delivered; it is for the builder, not a customer.
       The clip follows the scroll. Its one line (the owner's words, Arabic in both languages) comes in
       3 s into the clip; the «scroll down» cue at the bottom goes once you start scrolling. -->
  <section class="su-hero" id="hero">
    <div class="su-hero__frame" id="hero-frame">
      <div class="su-hero__placeholder" aria-hidden="true">
        <span>فيديو الواجهة — قريبًا</span>
        <span>Hero clip 9:16 · asset pending</span>
      </div>
      <p class="su-hero__line" id="hero-line" lang="ar" dir="rtl">بــ شن خاطرك تحلّي اليوم؟</p>
      <div class="su-hero__cue" aria-hidden="true">
        <svg class="su-hero__mouse" viewBox="0 0 24 36" fill="none" focusable="false">
          <rect x="1.5" y="1.5" width="21" height="33" rx="10.5" stroke="currentColor" stroke-width="2"/>
          <rect class="su-hero__wheel" x="10.5" y="7" width="3" height="7" rx="1.5" fill="currentColor"/>
        </svg>
        <span class="su-hero__cue-text" id="hero-cue-text">اسحب للأسفل</span>
      </div>
    </div>
  </section>

  <!-- blob + tagline (sketch Pages 2–3): one continuous blob. The drawing is laid out left-to-right in
       both languages (it does not mirror). The Arabic tagline is painted into the owner's artwork (its
       alt text says it); the live line below is the English tagline, shown only in English. -->
  <section class="su-blob" id="blob" dir="ltr">
    <div class="su-blob__main">
      <img class="su-blob__art" id="blob-art" src="assets/img/blob-tagline.png" alt="حياتك أكثر إبتهاجًا" lang="ar" width="3240" height="4050">
      <div class="su-blob__words">
        <p class="su-blob__tagline" id="tagline" hidden></p>
      </div>
    </div>
  </section>

  <!-- pourScene + clock + fork (sketch Page 3). Laid out left-to-right in both languages (the blob
       stream does not mirror); the copy column carries its own language. The video shows its FINISHED
       frame by default (no JS / reduced motion); motion/videos.js plays it once just before it scrolls in. -->
  <section class="su-pour" id="pour" dir="ltr">
    <div class="su-pour__stage">
      <div class="su-pour__media">
        <video class="su-pour__video" data-play-in-view muted playsinline preload="none" aria-hidden="true"

  <!-- utilityBar: sticky under the top bar (later it sits below the hero/blob/pour sequence). -->
  <div class="su-utility-bar" id="utility-bar">
    <div class="su-utility-bar__size" role="group" aria-labelledby="size-label">
      <span class="su-utility-bar__size-label" id="size-label">الحجم</span>
      <button type="button" class="su-utility-bar__size-btn" id="size-1" aria-pressed="true">١</button>
      <button type="button" class="su-utility-bar__size-btn" id="size-2" aria-pressed="false">٢</button>
    </div>
    <label class="su-utility-bar__search">
      <svg class="su-utility-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <span class="su-utility-bar__sr" id="search-label">ابحث في المنيو</span>
      <input class="su-utility-bar__input" id="search" type="search" placeholder="ابحث…" autocomplete="off" enterkeyhint="search">
    </label>
    <button type="button" class="su-utility-bar__lang" id="lang-btn">EN</button>
    <!-- search results: filled by src/js/features/search.js while something is typed -->
    <div class="su-utility-bar__results" id="search-results" hidden></div>
  </div>



  <main id="menu"></main>

  <!-- finale: «وين تلقانا؟» lands on #visit (branches, socials); then the outro, the page-2 blob in
       turquoise. Both are filled by finaleVisit.js and brandFooter.js. -->
